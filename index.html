<!DOCTYPE html>
<html>
  <head>
    <title>Classroom Lite</title>
    <link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon_purple.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">
          <img
            src="https://ssl.gstatic.com/classroom/favicon_purple.png"
            alt="Classroom"
          >
        </div>
        <div>
          <div class="brand-title">Classroom Lite</div>
          <div class="brand-subtitle">Les meves classes</div>
        </div>
      </div>

      <div class="actions">
        
        <button id="signout_button" onclick="handleSignoutClick()">Sign Out</button>
      </div>
    </header>

    <main class="container">
      <div id="loading" class="loading" aria-label="Carregant">
        <div class="loading-spinner">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/1/19/Google_Classroom_Logo.svg"
            alt="Classroom"
          >
        </div>
      </div>

      <section id="course_grid" class="course-grid"></section>

      <div id="content" class="status"></div>
    </main>

    <script src="script.js"></script>
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
  </body>
</html>
