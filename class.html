<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classe · Classroom Lite</title>

    <link rel="icon" type="image/png"
        href="https://ssl.gstatic.com/classroom/favicon_purple.png">

    <link rel="stylesheet" href="style.css">
</head>

<body class="class-page">

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">
                <img
                    src="https://ssl.gstatic.com/classroom/favicon_purple.png"
                    alt="Classroom"
                >
            </div>

            <div class="brand-copy">
                <div class="brand-title">Classroom Lite</div>

                <nav class="breadcrumb" aria-label="Navegació">
                    <a href="index.html" class="breadcrumb-link">
                        Les meves classes
                    </a>

                    <span class="breadcrumb-arrow">→</span>

                    <span id="breadcrumb-class" class="breadcrumb-current"></span>
                </nav>
            </div>
        </div>

        <div class="actions">

            <button
                id="signout_button"
                onclick="handleSignoutClick()"
            >
                Sign Out
            </button>

        </div>
    </header>

    <main class="class-container">

        <div id="class-banner" class="class-banner">

            <div class="class-banner-content">
                <div id="class-name" class="class-name"></div>
                <div id="class-section" class="class-section"></div>
            </div>

        </div>

        <section class="class-content">
            <!-- Aquí afegirem les tasques, materials, anuncis... -->
        </section>


    </main>

    
    

    <script>
        const params =
            new URLSearchParams(window.location.search);

        const courseId = params.get("id");

        const COURSES_STORAGE_KEY =
            "classroomLiteCourses";

        const APPEARANCE_STORAGE_KEY =
            "classroomLiteAppearance";

        const DEFAULT_APPEARANCE = {
            color: "blue",
            pattern: "none",
        };

        const ALLOWED_COLORS = [
            "blue",
            "green",
            "purple",
            "red",
        ];

        const ALLOWED_PATTERNS = [
            "none",
            "circles",
            "stripes",
            "diagonal",
        ];

        function readStorageObject(key) {
            try {
                const raw = localStorage.getItem(key);

                if (!raw) {
                    return {};
                }

                const parsed = JSON.parse(raw);

                return parsed &&
                    typeof parsed === "object"
                    ? parsed
                    : {};

            } catch (error) {
                console.error(
                    "Error llegint localStorage:",
                    error
                );

                return {};
            }
        }

        const courses =
            readStorageObject(
                COURSES_STORAGE_KEY
            );

        const appearances =
            readStorageObject(
                APPEARANCE_STORAGE_KEY
            );

        const course =
            courses[courseId];

        const name =
            course?.name || "Classe";

        const section =
            course?.section || "";

        const savedAppearance =
            appearances[courseId] || {};

        const color =
            ALLOWED_COLORS.includes(
                savedAppearance.color
            )
                ? savedAppearance.color
                : DEFAULT_APPEARANCE.color;

        const pattern =
            ALLOWED_PATTERNS.includes(
                savedAppearance.pattern
            )
                ? savedAppearance.pattern
                : DEFAULT_APPEARANCE.pattern;

        document.title =
            `${name} · Classroom Lite`;

        document.getElementById(
            "class-name"
        ).textContent = name;

        const sectionElement =
            document.getElementById(
                "class-section"
            );

        if (section) {
            sectionElement.textContent =
                section;
        } else {
            sectionElement.style.display =
                "none";
        }

        const banner =
            document.getElementById(
                "class-banner"
            );

        banner.classList.add(
            `color-${color}`,
            `pattern-${pattern}`
        );

        const breadcrumb =
            document.getElementById(
                "breadcrumb-class"
            );

        if (breadcrumb) {
            breadcrumb.textContent = name;
        }
    </script>

</body>
</html>
