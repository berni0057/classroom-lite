<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classe · Classroom Lite</title>

    <link rel="icon" type="image/png"
        href="https://ssl.gstatic.com/classroom/favicon_purple.png">

    <link rel="stylesheet" href="style.css">
</head>

<body class="class-page">

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">
                <img
                    src="https://ssl.gstatic.com/classroom/favicon_purple.png"
                    alt="Classroom"
                >
            </div>

            <div class="brand-copy">
                <div class="brand-title">Classroom Lite</div>

                <nav class="breadcrumb" aria-label="Navegació">
                    <a href="index.html" class="breadcrumb-link">
                        Les meves classes
                    </a>

                    <span class="breadcrumb-arrow">→</span>

                    <span id="breadcrumb-class" class="breadcrumb-current"></span>
                </nav>
            </div>
        </div>

        <div class="actions">
            <!-- aquí no hi posem res de moment -->
        </div>
    </header>

    <main class="class-container">

        <div id="class-banner" class="class-banner">

            <div class="class-banner-content">
                <div id="class-name" class="class-name"></div>
                <div id="class-section" class="class-section"></div>
            </div>

        </div>

        <section class="class-content">
            <!-- Aquí afegirem les tasques, materials, anuncis... -->
        </section>

    </main>

    <script>
        const params = new URLSearchParams(window.location.search);

        const name = params.get("name") || "Sense nom";
        const section = params.get("section") || "";
        const pattern = params.get("pattern") || "1";

        document.title = `${name} · Classroom Lite`;

        document.getElementById("class-name").textContent = name;
        document.getElementById("breadcrumb-class").textContent = name;

        const sectionElement = document.getElementById("class-section");

        if (section) {
            sectionElement.textContent = section;
        } else {
            sectionElement.style.display = "none";
        }

        const banner = document.getElementById("class-banner");
        banner.classList.add(`pattern-${pattern}`);
    </script>

</body>
</html>
